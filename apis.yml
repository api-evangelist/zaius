aid: zaius
name: Zaius
description: >-
  Zaius is the B2C marketing customer data platform (CDP) that Optimizely acquired in 2021 and now
  operates as the Optimizely Data Platform (ODP). It unifies customer, event, order, product, and
  custom data into a single behavioral profile, powers real-time audience segmentation, and drives
  personalization and orchestrated cross-channel campaigns. ODP exposes a versioned (v3) REST API
  surface across regional hosts (US/EU/AU) for events, customers, orders, products, objects, lists,
  consent, exports, schema management, recommendations, and real-time segments, plus a GraphQL query
  API and Web / React Native / Node SDKs. Authentication is via public (Tracker ID) and private
  x-api-key keys. Originally a portfolio company of Insight Partners.
