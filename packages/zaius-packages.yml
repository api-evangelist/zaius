note: >-
  Zaius shipped its client libraries under the @zaiusinc npm scope; after the Optimizely acquisition the
  tooling line moved to the @optimizely and @optimizely-opal scopes while the repositories stayed in the
  ZaiusInc GitHub org. Versions and publish dates below are read from the npm registry metadata endpoint.
  No first-party ODP client library exists for Python, Ruby, Java, PHP, Go, .NET or Rust — JavaScript /
  TypeScript is the only supported language.
