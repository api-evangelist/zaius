scope_model: per-endpoint-family
note: >-
  ODP publishes default limits per API family rather than per key or per account. Optimizely states higher
  limits are available on request via the Support team. The documentation does NOT publish rate-limit
  response headers or the status code returned on exhaustion, so an agent cannot read remaining quota at
  runtime — the only runtime signal is the error response itself.
